name: Build THT Gate APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f THT-Android-Project.zip
          unzip -t THT-Android-Project.zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-project
          mkdir android-project
          unzip -q THT-Android-Project.zip -d android-project
          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | sort | head -200

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_FILE")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          test -f gradlew
          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find '${{ steps.locate.outputs.project_dir }}' -type f -name '*.apk' | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/THT-Gate.apk

          test -s apk-output/THT-Gate.apk
          sha256sum apk-output/THT-Gate.apk

      - name: Upload THT Gate APK
        uses: actions/upload-artifact@v4
        with:
          name: THT-Gate-APK
          path: apk-output/THT-Gate.apk
          if-no-files-found: error
          retention-days: 30
