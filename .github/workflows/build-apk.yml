name: Build THT Gate APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$(find . -maxdepth 2 -type f \( -iname '*.zip' \) | head -n 1)"

          if [ -z "${ARCHIVE:-}" ]; then
            echo "ERROR: Android project ZIP was not found."
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Using archive: $ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-project
          mkdir android-project
          unzip -q "$ARCHIVE" -d android-project

          echo "Archive extracted."

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find android-project -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) | head -n 1)"

          if [ -z "${SETTINGS:-}" ]; then
            echo "ERROR: settings.gradle was not found."
            find android-project -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix JavaVersion compatibility
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Gradle files for obsolete JavaVersion.VERSION_8..."

          find "$PROJECT_DIR" -type f \( \
            -name '*.gradle' -o \
            -name '*.gradle.kts' \
          \) -print0 | while IFS= read -r -d '' FILE; do
            sed -i 's/JavaVersion\.VERSION_8/JavaVersion.VERSION_1_8/g' "$FILE"
          done

          if grep -R --include='*.gradle' \
                    --include='*.gradle.kts' \
                    'JavaVersion\.VERSION_8' \
                    "$PROJECT_DIR"; then
            echo "ERROR: JavaVersion.VERSION_8 still exists."
            exit 1
          fi

          echo "JavaVersion compatibility check passed."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Gradle wrapper if missing
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "Gradle wrapper missing. Creating Gradle 8.9 wrapper."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

          echo "Gradle wrapper ready."
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "${APK:-}" ]; then
            echo "ERROR: APK was not produced."
            find "$PROJECT_DIR" -type f -path '*/build/outputs/*' -print || true
            exit 1
          fi

          echo "APK produced: $APK"
          cp "$APK" THT-Gate.apk

      - name: Upload THT Gate APK
        uses: actions/upload-artifact@v4
        with:
          name: THT-Gate-APK
          path: THT-Gate.apk
          if-no-files-found: error
          retention-days: 30
