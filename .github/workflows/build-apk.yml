name: Build THT Gate APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f THT-Android-Project.zip
          echo "Project archive found."

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-project
          mkdir android-project
          unzip -q THT-Android-Project.zip -d android-project
          echo "Project extracted."

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts was not found."
            find android-project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle and create wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "Gradle wrapper is missing. Creating it."

            GRADLE_VERSION="8.7"
            GRADLE_ZIP="gradle-${GRADLE_VERSION}-bin.zip"
            GRADLE_URL="https://services.gradle.org/distributions/${GRADLE_ZIP}"

            curl -fsSL "$GRADLE_URL" -o "/tmp/${GRADLE_ZIP}"
            unzip -q "/tmp/${GRADLE_ZIP}" -d /tmp

            "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" wrapper \
              --gradle-version "$GRADLE_VERSION"
          fi

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Gradle wrapper ready."
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find "$PROJECT_DIR" -type f -name '*debug*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not produced."
            find "$PROJECT_DIR" -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "APK found: $APK_PATH"

          mkdir -p apk-output
          cp "$APK_PATH" apk-output/THT-Gate.apk

          test -f apk-output/THT-Gate.apk
          ls -lh apk-output/THT-Gate.apk

      - name: Upload THT Gate APK
        uses: actions/upload-artifact@v4
        with:
          name: THT-Gate-APK
          path: apk-output/THT-Gate.apk
          if-no-files-found: error
          retention-days: 30
