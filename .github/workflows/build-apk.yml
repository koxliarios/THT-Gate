name: Build THT Gate APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f THT-Android-Project.zip
          echo "Project archive found."

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-project
          mkdir android-project
          unzip -q THT-Android-Project.zip -d android-project
          echo "Archive extracted."
          find android-project -maxdepth 3 -type f | head -100

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW_PATH="$(find android-project -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew was not found in the extracted project."
            find android-project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          test -f gradlew
          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          APK_PATH="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Build completed but no debug APK was found."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload THT Gate APK
        uses: actions/upload-artifact@v4
        with:
          name: THT-Gate-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
